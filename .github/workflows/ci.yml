name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.259.0
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: Install schema-tools
        env:
          SCHEMA_TOOLS_VERSION: v0.8.1
          SCHEMA_TOOLS_SHA256: 8bd60e19dc61f8566738e9ad43e1c18dd0e8401d8de4a39258ac8fc38097be7e
        run: |
          set -euo pipefail
          archive="schema-tools-${SCHEMA_TOOLS_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/pulumi/schema-tools/releases/download/${SCHEMA_TOOLS_VERSION}/${archive}"
          echo "${SCHEMA_TOOLS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}"
          sudo install -m 0755 schema-tools /usr/local/bin/schema-tools
          schema-tools version
      - name: Determine baseline source commit
        if: github.event_name == 'pull_request'
        id: baseline-source
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          sha="$(git merge-base HEAD "origin/${BASE_REF}")"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Baseline source commit: $sha"
      # The artifacts workflow records a note for a main commit once its SDKs
      # are committed, so a pull request based on a fresh main commit can run
      # before its baseline exists. Wait for the note, and fail fast if the
      # artifacts run for the commit did not succeed.
      - name: Wait for the baseline artifacts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.baseline-source.outputs.sha }}
          NOTES_REF: refs/notes/pulumi-artifacts
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 20 * 60))
          while :; do
            git fetch -q origin "+${NOTES_REF}:${NOTES_REF}" 2>/dev/null || true
            if git notes --ref=pulumi-artifacts show "$SHA" >/dev/null 2>&1; then
              echo "Artifacts for $SHA are recorded."
              exit 0
            fi
            run="$(gh run list --workflow artifacts.yml --event push --commit "$SHA" \
              --limit 1 --json status,conclusion,url --jq '.[0] // {}')"
            status="$(jq -r '.status // "not found"' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [ "$status" = completed ] && [ "$conclusion" != success ]; then
              echo "::error::the artifacts run for $SHA finished with conclusion '$conclusion': $(jq -r .url <<<"$run")"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no artifacts recorded for $SHA after 20 minutes (artifacts run: $status)"
              exit 1
            fi
            echo "Waiting for the artifacts of $SHA (artifacts run: $status)."
            sleep 15
          done
      - uses: iwahbe/pulumi-publish@211f1f684151767629c827f9471fb5997cae0825 # main
        if: github.event_name == 'pull_request'
        with:
          mode: dump
          ref: ${{ steps.baseline-source.outputs.sha }}
          path: baseline
      - name: Validate baseline schema
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test -s baseline/schema.json
          jq -e '.name == "resend"' baseline/schema.json
      - name: Check generated schema compatibility
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -o bin/pulumi-resource-resend .
          pulumi package get-schema ./bin/pulumi-resource-resend > current-schema.json
          test -s current-schema.json
          schema-tools compare \
            --provider resend \
            --old-path baseline/schema.json \
            --new-path current-schema.json \
            --json --summary | tee schema-compatibility.json
          jq -e '.summary | length == 0' schema-compatibility.json
